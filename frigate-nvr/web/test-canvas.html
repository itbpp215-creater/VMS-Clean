<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Canvas Touch Test</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#1a1a2e; overflow:hidden; }
  canvas { display:block; width:100vw; height:100vh; touch-action:none; }
  #diag { position:fixed; bottom:20px; left:10px; color:#0f0; font:14px monospace;
    background:rgba(0,0,0,0.8); padding:8px 12px; border-radius:8px; z-index:99; }
</style>
</head><body>
<canvas id="c"></canvas>
<div id="diag">Waiting for touch...</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const diag = document.getElementById('diag');
const dpr = Math.min(window.devicePixelRatio || 1, 3);

// Resize
function resize() {
  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
  canvas.style.width = window.innerWidth + 'px';
  canvas.style.height = window.innerHeight + 'px';
  render();
}
window.addEventListener('resize', resize);

// Transform state
let tx = 200, ty = 300, scale = 1;
let renderCount = 0;

// Draw
function render() {
  renderCount++;
  const w = canvas.width / dpr, h = canvas.height / dpr;
  ctx.save();
  ctx.scale(dpr, dpr);
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, w, h);
  ctx.save();
  ctx.translate(tx, ty);
  ctx.scale(scale, scale);

  // Draw grid of colored rectangles
  const colors = ['#e74c3c','#3498db','#2ecc71','#f39c12','#9b59b6','#1abc9c','#e67e22','#34495e'];
  for (let row = 0; row < 8; row++) {
    for (let col = 0; col < 8; col++) {
      ctx.fillStyle = colors[(row + col) % colors.length];
      ctx.fillRect(col * 60, row * 60, 50, 50);
      ctx.fillStyle = '#fff';
      ctx.font = '12px sans-serif';
      ctx.fillText((row*8+col+1)+'', col*60+15, row*60+30);
    }
  }

  ctx.restore();
  ctx.restore();

  // Safari canvas refresh workaround
  canvas.style.opacity = '0.999';
  requestAnimationFrame(() => { canvas.style.opacity = '1'; });
}

// Pointer Events
let drag = null;
const ptrs = new Map();

canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  canvas.setPointerCapture(e.pointerId);
  if (ptrs.size === 1) {
    drag = { x0: e.clientX, y0: e.clientY, tx0: tx, ty0: ty };
    diag.textContent = 'DOWN id=' + e.pointerId + ' type=' + e.pointerType;
  }
});

canvas.addEventListener('pointermove', (e) => {
  e.preventDefault();
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (drag && ptrs.size === 1) {
    const dx = e.clientX - drag.x0;
    const dy = e.clientY - drag.y0;
    tx = drag.tx0 + dx;
    ty = drag.ty0 + dy;
    render();
    diag.textContent = 'MOVE dx=' + dx.toFixed(0) + ' dy=' + dy.toFixed(0) + ' R=' + renderCount;
  }
});

const cleanup = (e) => {
  ptrs.delete(e.pointerId);
  try { canvas.releasePointerCapture(e.pointerId); } catch(ex) {}
  if (ptrs.size === 0) drag = null;
  diag.textContent = 'UP R=' + renderCount;
};
canvas.addEventListener('pointerup', cleanup);
canvas.addEventListener('pointercancel', cleanup);

// Wheel zoom
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const factor = e.deltaY > 0 ? 0.9 : 1.1;
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  tx = mx - (mx - tx) * factor;
  ty = my - (my - ty) * factor;
  scale *= factor;
  render();
  diag.textContent = 'ZOOM s=' + scale.toFixed(3) + ' R=' + renderCount;
}, { passive: false });

resize();
diag.textContent = 'Ready! Drag to pan, scroll to zoom';
</script>
</body></html>

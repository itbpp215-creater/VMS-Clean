<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BPP-VMS Public Showcase</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            margin-top: 10px;
            margin-bottom: 30px;
            font-size: 28px;
            color: #c084fc;
            text-align: center;
        }
        .gallery {
            display: flex;
            flex-direction: column;
            gap: 40px;
            width: 100%;
            max-width: 1200px;
        }
        .gallery-item {
            background: #1e293b;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid #334155;
        }
        .gallery-item img {
            width: 100%;
            height: auto;
            display: block;
        }
        .desc {
            padding: 15px;
            text-align: center;
            font-size: 16px;
            color: #94a3b8;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>BPP-VMS Public Showcase</h1>

    <div class="gallery">
        <div class="gallery-item">
            <img src="/assets/public_showcase/img5.jpg" alt="CCTV Dashboard" />
            <div class="desc">ระบบแสดงผลกล้องวงจรปิดแบบเรียลไทม์</div>
        </div>
        <div class="gallery-item">
            <img src="/assets/public_showcase/img4.png" alt="Geographic Intelligence Dashboard" />
            <div class="desc">ระบบวิเคราะห์ข้อมูลและแผนที่ภูมิศาสตร์ (Geographic Intelligence)</div>
        </div>
        <div class="gallery-item">
            <img src="/assets/public_showcase/img1.png" alt="Arrest Dossier Vault" />
            <div class="desc">คลังบันทึกการจับกุมและแฟ้มบุคคล (Arrest Dossier Vault)</div>
        </div>
        <div class="gallery-item">
            <img src="/assets/public_showcase/img3.png" alt="Person Profile" />
            <div class="desc">แฟ้มประวัติส่วนบุคคลและข้อมูลเชื่อมโยง</div>
        </div>
        <div class="gallery-item">
            <img src="/assets/public_showcase/img2.png" alt="Link Analysis" />
            <div class="desc">ผังความสัมพันธ์แฟ้มคดี (Dossier Link Analysis)</div>
        </div>
    </div>

</body>
</html>

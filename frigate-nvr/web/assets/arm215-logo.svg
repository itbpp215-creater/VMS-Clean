<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090714"/>
      <stop offset="50%" stop-color="#160d2e"/>
      <stop offset="100%" stop-color="#060913"/>
    </linearGradient>
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="48%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="armGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="numGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Aggressive Mecha/Esports Shield Polygon -->
  <polygon points="60,4 110,22 114,76 60,116 6,76 10,22" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="4.5" stroke-linejoin="round"/>
  <polygon points="60,11 103,26 106,72 60,108 14,72 17,26" fill="none" stroke="rgba(56,189,248,0.28)" stroke-width="1.4"/>

  <!-- Cyber Slash Accents -->
  <path d="M18,32 L42,18" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/>
  <path d="M102,80 L76,100" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <polygon points="60,14 68,26 59,26 64,37 51,23 59,23" fill="#f43f5e" filter="url(#neonGlow)"/>

  <!-- Fierce Slanted "ARM" Typography -->
  <g transform="translate(0, 2) skewX(-11)">
    <text x="64" y="61" text-anchor="middle" font-family="'Orbitron', 'Rajdhani', 'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="33" letter-spacing="1.5" fill="url(#armGrad)" filter="url(#neonGlow)">ARM</text>
  </g>

  <!-- Aggressive Speed Divider Blade -->
  <polygon points="22,68 98,64 92,70 18,71" fill="url(#rimGrad)"/>

  <!-- Bold Street/Cyber "215" -->
  <g transform="skewX(-10)">
    <text x="67" y="95" text-anchor="middle" font-family="'Orbitron', 'Rajdhani', 'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="25" letter-spacing="3" fill="url(#numGrad)" filter="url(#neonGlow)">215</text>
  </g>
</svg>

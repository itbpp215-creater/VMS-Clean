<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sloth BPP 215 - Login</title>
  <link rel="stylesheet" href="assets/login.css">
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-brand">
        <div class="brand-logo">
          <img src="assets/BPP215.png" alt="BPP215 Logo" style="width: 100%; height: 100%; object-fit: contain;">
        </div>
        <h1>Sloth BPP 215</h1>
        <p>ระบบตรวจจับป้ายทะเบียนและเฝ้าระวังความปลอดภัยอัจฉริยะ</p>
      </div>

      <form id="loginForm" class="login-form">
        <div class="field">
          <label for="username">ชื่อผู้ใช้งาน</label>
          <div class="input-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            <input type="text" id="username" placeholder="Username" required autofocus autocomplete="username">
          </div>
        </div>
        
        <div class="field">
          <label for="password">รหัสผ่าน</label>
          <div class="input-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            <input type="password" id="password" placeholder="Password" required autocomplete="current-password">
          </div>
        </div>

        <div id="errorMsg" class="error-msg" hidden></div>

        <button type="submit" id="btnLogin" class="btn-primary">
          <span id="spin" class="spinner" hidden></span>
          เข้าสู่ระบบ
        </button>
      </form>
      
      <div class="login-footer">
        หากลืมรหัสผ่าน กรุณาติดต่อผู้ดูแลระบบ (Admin) · <a href="user_guide.html" target="_blank" rel="noopener noreferrer" style="color: #a855f7; text-decoration: none; font-weight: 500; display: inline-flex; align-items: center; gap: 4px;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -2px;"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>คู่มือการใช้งาน</a>
      </div>
    </div>
  </div>
  
  <script src="assets/login.js"></script>
</body>
</html>

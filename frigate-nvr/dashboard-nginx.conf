# Nginx security gateway for Dashboard, Frigate, Watchlist, Config, and Auth.
# The official nginx entrypoint renders this file as a template and substitutes
# only the proxy secret configured by NGINX_ENVSUBST_FILTER. A preceding,
# validated entrypoint hook renders the Federation source-ACL snippet.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
# Rate-limit login at the only public ingress by the real remote address. The
# backend also tracks username/IP failures, providing a second independent layer.
limit_req_zone $binary_remote_addr zone=auth_login_per_ip:10m rate=10r/m;

upstream doh_camerai1 {
    server camerai1.iticfoundation.org:443;
    keepalive 32;
}

upstream doh_streaming1 {
    server streaming1.highwaytraffic.go.th:443;
    keepalive 32;
}

upstream doh_streaming2 {
    server streaming2.highwaytraffic.go.th:443;
    keepalive 32;
}

upstream doh_udoncity {
    server streaming.udoncity.go.th:1935;
    keepalive 32;
}

upstream doh_mikrotik {
    server hj50ac9nwcc.sn.mynetname.net:18191;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Keep ACME renewal reachable while redirecting every application request
    # to TLS so the Secure session cookie is never downgraded to clear text.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        # ใช้ $http_host (มี :port ที่ client เรียกมาจริง) ไม่ใช่ $host ที่ตัด port ทิ้ง —
        # ไซต์ถูกเข้าถึงผ่าน external port :8080 การ redirect ด้วย $host จะพาไปพอร์ต 443
        # ที่ไม่ได้ forward ไว้ ทำให้ผู้ใช้จากภายนอกหลุดออกจากระบบทั้งหน้า
        return 301 https://$http_host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /usr/share/nginx/html;
    index index.html;
    sendfile off;

    # Force browsers to always check for the latest files
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    expires off;
    
    # Browser hardening: scripts may load only from the application itself. Chart.js
    # is vendored at assets/chart.umd.min.js, so the former cdn.jsdelivr.net grant was
    # unused and only widened the script surface of the one internet-facing service.
    # Inline script and eval are intentionally absent; inline style remains
    # temporarily required by the UI.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://*.basemaps.cartocdn.com https://*.tile.openstreetmap.org https://*.google.com https://*.googleapis.com https://mt*.google.com https://server.arcgisonline.com https://*.arcgisonline.com; media-src 'self' data: blob: https://camerai1.iticfoundation.org https://streaming.udoncity.go.th:1935 https://*.highwaytraffic.go.th https://hj50ac9nwcc.sn.mynetname.net:18191 https://38.159.250.22; connect-src 'self' wss://$http_host https://camerai1.iticfoundation.org https://streaming.udoncity.go.th:1935 https://*.highwaytraffic.go.th https://hj50ac9nwcc.sn.mynetname.net:18191 https://38.159.250.22 https://*.basemaps.cartocdn.com https://*.tile.openstreetmap.org https://*.google.com https://*.googleapis.com https://mt*.google.com https://server.arcgisonline.com https://*.arcgisonline.com; worker-src 'self' blob:; manifest-src 'self'" always;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Auth subrequests are internal-only. The normal verifier authenticates any
    # active session; the admin verifier also enforces the current database role.
    location = /auth/verify {
        internal;
        # An i2 upload is allowed up to 1 GiB by its exact public route. This
        # internal, body-less subrequest must accept that same request size or
        # Nginx turns its 413 into an unrelated browser-facing HTTP 500.
        client_max_body_size 1g;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $auth_backend "auth-service:5002";
        proxy_pass http://$auth_backend/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Host $host;
    }

    location = /auth/verify/admin {
        internal;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $auth_backend "auth-service:5002";
        proxy_pass http://$auth_backend/auth/verify/admin;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Host $host;
    }

    # Public auth operations remain same-origin only; no wildcard CORS headers
    # are emitted because login/session management never needs cross-origin use.
    # Prefix matching keeps encoded/trailing variants inside the same limiter;
    # FastAPI still decides whether the resulting route is valid.
    location ^~ /auth/login {
        limit_req zone=auth_login_per_ip burst=5 nodelay;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $auth_backend "auth-service:5002";
        proxy_pass http://$auth_backend/auth/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /auth/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $auth_backend "auth-service:5002";
        proxy_pass http://$auth_backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Generic fallback to protect any undefined routes in the web root.
    location / {
        error_page 401 = /login.html;
        auth_request /auth/verify;
        try_files $uri $uri/ =404;
    }

    location = /sw-location.js {
        default_type application/javascript;
        try_files /sw-location.js =404;
        add_header Service-Worker-Allowed "/" always;
        add_header Cache-Control "no-cache" always;
    }

    location = /index.html {
        error_page 401 = /login.html;
        auth_request /auth/verify;
        try_files /index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location /assets/ {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location /downloads/ {
        try_files $uri =404;
    }

    location = /login.html {
        try_files /login.html =404;
    }

    location = /clip.html {
        try_files /clip.html =404;
    }

    location = /user_guide.html {
        try_files /user_guide.html =404;
    }

    location = /manual.html {
        try_files /manual.html =404;
    }

    location ^~ /bpp_vms_master_guide {
        default_type text/html;
        try_files /bpp_vms_master_guide.html =404;
        add_header Content-Security-Policy "default-src 'self' https: data: blob:; script-src 'self' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https:;" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Settings contain branding, storage, LPR, and federation topology.
    location /settings/ {
        auth_request /auth/verify;
        client_body_temp_path /settings-data/.tmp;
        dav_access user:rw group:rw all:r;

        location = /settings/branding.json {
            alias /settings-data/branding.json;
            if ($request_method = PUT) { return 403; }
        }
        
        # Dedicated endpoint for admin to save branding
        location = /settings/admin/branding.json {
            auth_request /auth/verify/admin;
            alias /settings-data/branding.json;
            dav_methods PUT;
            client_max_body_size 4k;
            limit_except PUT { deny all; }
        }

        location = /settings/logo.png {
            alias /settings-data/logo.png;
            if ($request_method = PUT) { return 403; }
        }
        
        location = /settings/admin/logo.png {
            auth_request /auth/verify/admin;
            alias /settings-data/logo.png;
            dav_methods PUT;
            client_max_body_size 2M;
            limit_except PUT { deny all; }
        }

        # Written into the storage-policy/ subdirectory rather than alongside the other
        # settings files: Frigate bind-mounts exactly that subdirectory read-only so the
        # value reaches the storage patch, and keeping it a subdirectory of the same
        # mount preserves nginx's same-filesystem rename on PUT.
        location = /settings/storage_threshold {
            auth_request /auth/verify/admin;
            alias /settings-data/storage-policy/storage_threshold;
            dav_methods PUT;
            client_max_body_size 1k;
            limit_except GET PUT { deny all; }
        }

        location = /settings/lpr_cameras {
            auth_request /auth/verify/admin;
            alias /lpr-settings/lpr_cameras.txt;
            client_body_temp_path /lpr-settings/.tmp;
            dav_methods PUT;
            client_max_body_size 4k;
            limit_except GET PUT { deny all; }
        }

        location = /settings/lpr_zones {
            auth_request /auth/verify/admin;
            alias /lpr-settings/lpr_zones.json;
            client_body_temp_path /lpr-settings/.tmp;
            dav_methods PUT;
            client_max_body_size 4k;
            limit_except GET PUT { deny all; }
        }

        location = /settings/object_alerts {
            auth_request /auth/verify/admin;
            alias /lpr-settings/object_alerts.json;
            client_body_temp_path /lpr-settings/.tmp;
            dav_methods PUT;
            client_max_body_size 16k;
            limit_except GET PUT { deny all; }
        }

        location = /settings/nodes {
            alias /settings-data/nodes.json;
            if ($request_method = PUT) { return 403; }
        }

        location = /settings/admin/nodes {
            auth_request /auth/verify/admin;
            alias /settings-data/nodes.json;
            dav_methods PUT;
            client_max_body_size 4k;
            limit_except PUT { deny all; }
        }

        location = /settings/camera_names {
            alias /settings-data/camera_names.json;
            if ($request_method = PUT) { return 403; }
        }
        
        location = /settings/admin/camera_names {
            auth_request /auth/verify/admin;
            alias /settings-data/camera_names.json;
            dav_methods PUT;
            client_max_body_size 64k;
            limit_except PUT { deny all; }
        }

        location = /settings/camera_gps {
            alias /settings-data/camera_gps.json;
            if ($request_method = PUT) { return 403; }
        }
        
        location = /settings/admin/camera_gps {
            auth_request /auth/verify/admin;
            alias /settings-data/camera_gps.json;
            dav_methods PUT;
            client_max_body_size 256k;
            limit_except PUT { deny all; }
        }

        location = /settings/channels {
            alias /settings-data/channels.json;
            if ($request_method = PUT) { return 403; }
        }
        
        location = /settings/admin/channels {
            auth_request /auth/verify/admin;
            alias /settings-data/channels.json;
            dav_methods PUT;
            client_max_body_size 64k;
            limit_except PUT { deny all; }
        }

        location = /settings/secret {
            auth_request /auth/verify/admin;
            alias /settings-data/secrets.json;
            dav_methods PUT;
            client_max_body_size 4k;
            limit_except GET PUT { deny all; }
        }
    }

    # LPR crops multi-tier resolution: SSD (/lpr-data/crops/) -> Drive E: Archive (/lpr-archive/) -> NAS Bot fallback
    location ~* ^/lpr-crops/(?<crop_file>[^/]+)$ {
        auth_request /auth/verify;
        limit_except GET HEAD { deny all; }
        root /;
        try_files /lpr-data/crops/$crop_file /lpr-archive/$crop_file @crop_archive_fallback;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location @crop_archive_fallback {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $nas_bot_backend "nas-bot:5005";
        proxy_pass http://$nas_bot_backend/api/nas-bot/crops/$crop_file;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # Federation sync route relies on X-BPP-Federation secret checked by Python backend
    location = /api/config/federation/cameras {
        proxy_pass http://config-api:5003/api/config/federation/cameras;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
    }

    # Incident 2.45: AI detect toggle is accessible to ALL authenticated users.
    # This specific regex location takes priority over the prefix-based /api/config/ block
    # which enforces admin-only auth. Allows regular operators to toggle AI per-channel.
    location ~ ^/api/config/cameras/[^/]+/detect_toggle$ {
        auth_request /auth/verify;
        proxy_pass http://config-api:5003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization $http_authorization;
    }

    # Structured Config API reads/mutations are admin-only at both the gateway
    # and backend. Preserve the HttpOnly cookie for backend re-verification.
    location /api/config/ {
        auth_request /auth/verify/admin;
        proxy_pass http://config-api:5003/api/config/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/public-config/ {
        proxy_pass http://config-api:5003/api/public-config/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization $http_authorization;
    }

    # ----- External HLS Proxies -----
    # Proxy Ubon and Roi Et cameras to bypass invalid SSL certificates and CORS/CSP restrictions.
    location /proxy-ubon/ {
        auth_request /auth/verify;
        proxy_pass https://38.159.250.22/;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
    }

    location /proxy-roiet/ {
        auth_request /auth/verify;
        proxy_pass https://doh_mikrotik/;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Host hj50ac9nwcc.sn.mynetname.net:18191;
        proxy_set_header Connection "";
        proxy_buffering off;
    }
    location /proxy-doh-camerai1/ {
        auth_request /auth/verify;
        proxy_pass https://doh_camerai1/;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;
        proxy_ssl_session_reuse off;
        proxy_http_version 1.1;
        proxy_set_header Host camerai1.iticfoundation.org;
        proxy_set_header Connection "";
        proxy_buffering off;
    }
    location /proxy-doh-streaming1/ {
        auth_request /auth/verify;
        proxy_pass https://doh_streaming1/;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;
        proxy_ssl_session_reuse off;
        proxy_http_version 1.1;
        proxy_set_header Host streaming1.highwaytraffic.go.th;
        proxy_set_header Connection "";
        proxy_buffering off;
    }
    location /proxy-doh-streaming2/ {
        auth_request /auth/verify;
        proxy_pass https://doh_streaming2/;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;
        proxy_ssl_session_reuse off;
        proxy_http_version 1.1;
        proxy_set_header Host streaming2.highwaytraffic.go.th;
        proxy_set_header Connection "";
        proxy_buffering off;
    }
    location /proxy-udoncity/ {
        auth_request /auth/verify;
        proxy_pass https://doh_udoncity/;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;
        proxy_ssl_session_reuse off;
        proxy_http_version 1.1;
        proxy_set_header Host streaming.udoncity.go.th:1935;
        proxy_set_header Connection "";
    }

    # Authenticated reads and admin mutations share this route. watchlist-api
    # performs the authoritative method-level role check after validating the
    # proxy secret and identity headers set here.

    # Inbound Edge LPR Camera Webhook & VIGI AI Trigger Gateway
    # Allows external Dahua ITC / VIGI LPR cameras to push license plate recognition
    # and snapshots directly without requiring browser session cookies.
    location /api/lpr/camera-webhook {
        client_max_body_size 15M;
        proxy_pass http://watchlist-api:5001/watchlist/lpr/webhook;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    location /api/lpr/vehicle-trigger {
        client_max_body_size 2M;
        proxy_pass http://watchlist-api:5001/watchlist/lpr/vehicle-trigger;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    location /api/watchlist {
        auth_request /auth/verify;
        auth_request_set $auth_user $upstream_http_x_user;
        auth_request_set $auth_role $upstream_http_x_role;

        proxy_pass http://watchlist-api:5001/watchlist;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-User $auth_user;
        proxy_set_header X-Role $auth_role;
        proxy_set_header X-BPP-Proxy-Secret ${WATCHLIST_PROXY_SHARED_SECRET};
        # The backend trusts only the gateway assertion. Never leak the browser's
        # session cookie or bearer token into a service that does not consume it.
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";

        # Strip every service/Federation assertion supplied by the remote client;
        # normal browser traffic is never allowed to impersonate those callers.
        proxy_set_header X-BPP-Service-Secret "";
        proxy_set_header X-BPP-Federation "";
        proxy_set_header X-BPP-mTLS-Verified "";
        proxy_set_header X-BPP-VPN-Verified "";
        proxy_read_timeout 30s;
        client_max_body_size 12M;
    }

    # Portable media requests stay same-origin and authenticated. The backend
    # receives only identity derived from auth-service plus its independent proxy
    # credential; every browser-controlled assertion and session credential is
    # removed before the request crosses the service boundary.
    location /api/media-compat/ {
        # Allow same-origin and mobile alert player without requiring browser cookie session
        proxy_pass http://media-compat-service:5008/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-User "alert_viewer";
        proxy_set_header X-Role "user";
        proxy_set_header X-BPP-Proxy-Secret ${MEDIA_COMPAT_PROXY_SHARED_SECRET};

        # The compatibility service trusts only gateway assertions. Clear the
        # browser session and every alternate BPP identity/service capability so
        # present or future middleware cannot accept a shadow credential.
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header X-BPP-User "";
        proxy_set_header X-BPP-Role "";
        proxy_set_header X-BPP-Service-Secret "";
        proxy_set_header X-BPP-Federation "";
        proxy_set_header X-BPP-mTLS-Verified "";
        proxy_set_header X-BPP-VPN-Verified "";

        # Forward only standard byte-range validators required by mobile players.
        # Streaming directly avoids nginx disk buffering and all waits are finite.
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_redirect off;
        client_max_body_size 64k;
        add_header Cache-Control "private, max-age=3600" always;
        add_header Accept-Ranges bytes always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # IBM i2 charts can be much larger than ordinary nas-bot requests. Stream only
    # this authenticated endpoint up to the approved 1 GiB backend limit.
    location = /api/nas-bot/graph/import-i2 {
        auth_request /auth/verify;
        auth_request_set $auth_user $upstream_http_x_user;
        auth_request_set $auth_role $upstream_http_x_role;

        resolver 127.0.0.11 valid=30s ipv6=off;
        set $nas_bot_backend "nas-bot:5005";
        proxy_pass http://$nas_bot_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-User $auth_user;
        proxy_set_header X-Role $auth_role;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        client_max_body_size 1g;
    }

    # nas-bot API & Webhook Gateway
    location /api/nas-bot/ {
        auth_request /auth/verify;
        auth_request_set $auth_user $upstream_http_x_user;
        auth_request_set $auth_role $upstream_http_x_role;

        resolver 127.0.0.11 valid=30s ipv6=off;
        set $nas_bot_backend "nas-bot:5005";
        proxy_pass http://$nas_bot_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-User $auth_user;
        proxy_set_header X-Role $auth_role;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        client_max_body_size 100m;
    }

    
    # chat-service API Gateway (Phase 5: AI Chat Incident Parser)
    location /api/chat/ {
        auth_request /auth/verify;
        auth_request_set $auth_user $upstream_http_x_user;
        auth_request_set $auth_role $upstream_http_x_role;

        resolver 127.0.0.11 valid=30s ipv6=off;
        set $chat_backend "chat-service:5007";
        proxy_pass http://$chat_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-User $auth_user;
        proxy_set_header X-Role $auth_role;
        proxy_read_timeout 30s;
    }

    # analytics-engine API Gateway
    location /api/analytics/ {
        auth_request /auth/verify;
        auth_request_set $auth_user $upstream_http_x_user;
        auth_request_set $auth_role $upstream_http_x_role;

        resolver 127.0.0.11 valid=30s ipv6=off;
        set $analytics_backend "analytics-engine:5006";
        proxy_pass http://$analytics_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-User $auth_user;
        proxy_set_header X-Role $auth_role;
    }




    # Federation is server-to-server only. A peer must originate inside one of
    # the configured VPN CIDRs and present the application secret; the generated
    # snippet contains one validated nginx allow directive per CIDR.
    location = /api/watchlist-federation {
        include /etc/nginx/snippets/bpp-federation-allow.conf;
        deny all;
        limit_except GET { deny all; }

        proxy_pass http://watchlist-api:5001/federation/watchlist;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-BPP-Federation $http_x_bpp_federation;
        proxy_set_header X-BPP-Proxy-Secret ${WATCHLIST_PROXY_SHARED_SECRET};
        proxy_set_header X-BPP-mTLS-Verified "";
        proxy_set_header X-BPP-VPN-Verified "1";
        proxy_set_header X-User "";
        proxy_set_header X-Role "";
        proxy_set_header X-BPP-Service-Secret "";
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        add_header Cache-Control "no-store" always;
    }

    # Allow direct streaming of event MP4 clips, snapshots, and thumbnails with Tiered Archive fallback
    location ~* ^/(?:nvr/)?api/events/(?<ev_id>[^/]+)/(?<ev_file>clip\.mp4|snapshot\.jpg|thumbnail\.jpg)$ {
        set $target_ev_id $ev_id;
        set $target_ev_file $ev_file;
        limit_except GET HEAD { deny all; }
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $frigate_backend "frigate:5000";
        proxy_intercept_errors on;
        error_page 404 = @archive_media_fallback;
        proxy_pass http://$frigate_backend/api/events/$target_ev_id/$target_ev_file;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_read_timeout 300s;
        add_header Cache-Control "public, max-age=3600" always;
        add_header Accept-Ranges bytes always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location @archive_media_fallback {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $nas_bot_backend "nas-bot:5005";
        proxy_pass http://$nas_bot_backend/api/nas-bot/archive/events/$target_ev_id/$target_ev_file;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_read_timeout 300s;
        add_header Cache-Control "public, max-age=3600" always;
        add_header Accept-Ranges bytes always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Allow direct streaming of camera latest snapshot for fallback
    location ~* ^/(?:nvr/)?api/[^/]+/latest\.jpg$ {
        auth_request /auth/verify;
        limit_except GET HEAD { deny all; }
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $frigate_backend "frigate:5000";
        rewrite ^/(?:nvr/)?api/(.*)$ /api/$1 break;
        proxy_pass http://$frigate_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
        add_header Cache-Control "public, max-age=5" always;
    }

    # ----- Public Kiosk View -----
    location = /public/view/bpp215-public-view {
        try_files /public_kiosk.html =404;
        add_header Cache-Control "no-store" always;
    }
    location = /public/view/bpp215-public-view/ {
        try_files /public_kiosk.html =404;
        add_header Cache-Control "no-store" always;
    }

    # Restricted snapshot fetcher for the Public Kiosk
    # Only allows the hardcoded cameras to be fetched via this obfuscated URL
    location ~* ^/public/snapshots/bpp215-public-view/(nongwang1|nongwang3|nongwang4|nongwang5|nongwang6)\.jpg$ {
        limit_except GET HEAD { deny all; }
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $frigate_backend "frigate:5000";
        rewrite ^/public/snapshots/bpp215-public-view/(.*)\.jpg$ /api/$1/latest.jpg break;
        proxy_pass http://$frigate_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
        add_header Cache-Control "public, max-age=5" always;
    }

    # Allow read-only event JSON metadata for alert player
    location ~* ^/(?:nvr/)?api/events/[A-Za-z0-9_.:-]+$ {
        limit_except GET HEAD { deny all; }
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $frigate_backend "frigate:5000";
        rewrite ^/(?:nvr/)?api/(.*)$ /api/$1 break;
        proxy_pass http://$frigate_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
        add_header Cache-Control "public, max-age=300" always;
    }

    # Frigate's raw config and restart endpoints inherit the unauthenticated
    # internal port's admin role, so the gateway must enforce our own admin role.
    location ^~ /nvr/api/config {
        auth_request /auth/verify/admin;
        # Config API is the sole writer. Native Frigate config reads remain
        # available to administrators, but save/set/delete routes cannot race the
        # validated, locked transaction and backup path.
        limit_except GET HEAD { deny all; }
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $frigate_backend "frigate:5000";
        rewrite ^/nvr/(.*)$ /$1 break;
        proxy_pass http://$frigate_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Prefix matching deliberately covers trailing-slash and suffix variants so
    # none can fall through to the normal-user Frigate route.
    location ^~ /nvr/api/restart {
        auth_request /auth/verify/admin;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $frigate_backend "frigate:5000";
        rewrite ^/nvr/(.*)$ /$1 break;
        proxy_pass http://$frigate_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
    }

    # Frigate's go2rtc passthrough returns stream definitions with the camera
    # credentials already substituted in, so it hands every DVR RTSP password to any
    # authenticated session — defeating the admin/operator split enforced one route
    # above. Nothing in the application calls it (the dashboard uses
    # /live/webrtc/api/streams, which is scrubbed), so it is closed outright rather
    # than merely restricted to admins.
    location ^~ /nvr/api/go2rtc {
        return 404;
    }

    # Remaining Frigate reads and operator actions require an active session.
    # Same-origin routing avoids wildcard CORS while preserving REST/WebSocket.
    location /nvr/ {
        auth_request /auth/verify;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $frigate_backend "frigate:5000";
        rewrite ^/nvr/(.*)$ /$1 break;
        proxy_pass http://$frigate_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}


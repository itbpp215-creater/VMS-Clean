    # watchlist.db ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸Ãƒâ€¹Ã¢â‚¬Â ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸Ãƒâ€šÃ‚Â°ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸ÃƒÂ¢Ã¢â€šÂ¬Ã¢â‚¬Å“ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸Ãƒâ€šÃ‚Â¹ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸Ãƒâ€šÃ‚ÂÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸Ãƒâ€šÃ‚ÂªÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸Ãƒâ€šÃ‚Â£ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¹ÃƒÂ¢Ã¢â€šÂ¬Ã‚Â°ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸Ãƒâ€šÃ‚Â²ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸ÃƒÂ¢Ã¢â€šÂ¬Ã‚Â¡ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸Ãƒâ€šÃ‚Â­ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸Ãƒâ€šÃ‚Â±ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸ÃƒÂ¢Ã¢â€šÂ¬Ã‚Â¢ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¹ÃƒÂ¢Ã¢â€šÂ¬Ã…Â¡ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸ÃƒÂ¢Ã¢â‚¬Å¾Ã‚Â¢ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸Ãƒâ€šÃ‚Â¡ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸Ãƒâ€šÃ‚Â±ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸ÃƒÂ¢Ã¢â€šÂ¬Ã‚Â¢ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸Ãƒâ€šÃ‚Â´ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¹Ãƒâ€ Ã¢â‚¬â„¢ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸ÃƒÂ¢Ã¢â‚¬Å¾Ã‚Â¢ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¹ÃƒÂ¢Ã¢â€šÂ¬Ã…Â¾ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸ÃƒÂ¢Ã¢â€šÂ¬Ã‚ÂÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¹ÃƒÂ¢Ã¢â‚¬Å¡Ã‚Â¬ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸Ãƒâ€šÃ‚Â£ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸Ãƒâ€šÃ‚ÂÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸ÃƒÂ¢Ã¢â€šÂ¬Ã¢â‚¬ÂÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸Ãƒâ€šÃ‚Â­ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸Ãƒâ€šÃ‚Â£ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸Ãƒâ€šÃ‚ÂµÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸ÃƒÂ¢Ã¢â‚¬Å¾Ã‚Â¢ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸Ãƒâ€šÃ‚ÂµÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¹ÃƒÂ¢Ã¢â€šÂ¬Ã‚Â°ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¹ÃƒÂ¢Ã¢â‚¬Å¡Ã‚Â¬ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸Ãƒâ€šÃ‚Â¡ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸Ãƒâ€šÃ‚Â·ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¹Ãƒâ€¹Ã¢â‚¬Â ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸Ãƒâ€šÃ‚Â­ service ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¹ÃƒÂ¢Ã¢â‚¬Å¡Ã‚Â¬ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸Ãƒâ€šÃ‚Â£ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸Ãƒâ€šÃ‚Â´ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¹Ãƒâ€¹Ã¢â‚¬Â ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸Ãƒâ€šÃ‚Â¡ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸ÃƒÂ¢Ã¢â€šÂ¬Ã‚Â¢ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¹ÃƒÂ¢Ã¢â€šÂ¬Ã‚Â°ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸ÃƒÂ¢Ã¢â‚¬Å¾Ã‚Â¢ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸ÃƒÂ¢Ã¢â€šÂ¬Ã…Â¾ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸Ãƒâ€šÃ‚Â£ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸Ãƒâ€šÃ‚Â±ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¹ÃƒÂ¢Ã¢â€šÂ¬Ã‚Â°ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸ÃƒÂ¢Ã¢â€šÂ¬Ã‚Â¡ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¹Ãƒâ€šÃ‚ÂÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸Ãƒâ€šÃ‚Â£ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸Ãƒâ€šÃ‚Â
    volumes:
      - ./config/lpr:/data
      - ./lpr-data:/lpr-data
      - ${BPP_ARCHIVE_CROPS_DIR:-./storage/lpr-archive}:/lpr-archive:ro
      - ./config/dashboard-settings:/settings-data:ro
      - ./watchlist-api/api.py:/app/api.py:ro
      - ./watchlist-api/lpr_learning.py:/app/lpr_learning.py:ro
    environment:
      WATCHLIST_PROXY_SHARED_SECRET: ${WATCHLIST_PROXY_SHARED_SECRET:?WATCHLIST_PROXY_SHARED_SECRET is required}
      WATCHLIST_FEDERATION_SHARED_SECRET: ${WATCHLIST_FEDERATION_SHARED_SECRET:?WATCHLIST_FEDERATION_SHARED_SECRET is required}
      WATCHLIST_SERVICE_SHARED_SECRET: ${WATCHLIST_SERVICE_SHARED_SECRET:?WATCHLIST_SERVICE_SHARED_SECRET is required}
      AUTH_AUDIT_SHARED_SECRET: ${AUTH_AUDIT_SHARED_SECRET:?AUTH_AUDIT_SHARED_SECRET is required}
      WATCHLIST_ALLOWED_ORIGINS: ${WATCHLIST_ALLOWED_ORIGINS:-}
      LPR_SUPERADMIN_USERNAME: ${LPR_SUPERADMIN_USERNAME:-arm215}
      LOCAL_ARCHIVE_CROPS_PATH: /lpr-archive

  lpr:
    container_name: lpr-service
    image: lpr-service:local
    build:
      context: ./lpr-service
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - media
      - lpr-data
      - media-egress
    depends_on:
      - frigate
      - watchlist-api
    environment:
      LPR_ALERT_COOLDOWN: ${LPR_ALERT_COOLDOWN:-30}
      LPR_ALERT_LOCATION: ${LPR_ALERT_LOCATION:-Sloth BPP 215}
      LPR_BOX_PAD_RATIO: ${LPR_BOX_PAD_RATIO:-0.15}
      LPR_CAMERAS: ${LPR_CAMERAS:-cam11}
      LPR_CAMERAS_FILE: ${LPR_CAMERAS_FILE:-/lpr-config/lpr_cameras.txt}
      LPR_CHAR_CONF: ${LPR_CHAR_CONF:-0.25}
      LPR_CHAR_MODEL: ${LPR_CHAR_MODEL:-/models/data_plate.pt}
      LPR_DATA_DIR: ${LPR_DATA_DIR:-/data}
      LPR_DEVICE: ${LPR_DEVICE:-auto}
      LPR_DISCORD_WEBHOOK_URL: ${LPR_DISCORD_WEBHOOK_URL:-}
      LPR_FRAME_INTERVAL: ${LPR_FRAME_INTERVAL:-0.8}
      LPR_FEDERATION_CA_BUNDLE: ${LPR_FEDERATION_CA_BUNDLE:-}
      LPR_FRIGATE_BASE_URL: ${LPR_FRIGATE_BASE_URL:-http://frigate:5000}
      LPR_GO2RTC_BASE_URL: ${LPR_GO2RTC_BASE_URL:-http://frigate:1984}
      LPR_LABELS: ${LPR_LABELS:-car,motorcycle,truck,bus,person}
      LPR_VEHICLE_LABELS: ${LPR_VEHICLE_LABELS:-car,motorcycle,truck,bus}
      LPR_LINE_OCR_MODEL: ${LPR_LINE_OCR_MODEL:-/models/line_ocr_best.pt}
      LPR_MODEL_VERSION: ${LPR_MODEL_VERSION:-baseline-20260818}
      LPR_MODEL_STORE_DIR: /model-store
      LPR_LOG_LEVEL: ${LPR_LOG_LEVEL:-INFO}
      LPR_LOG_RETAIN_DAYS: ${LPR_LOG_RETAIN_DAYS:-14}
      # Bound high-resolution sampling and require repeated OCR agreement before
      # an AI-only pending plate becomes searchable in Frigate.
      LPR_MAINSTREAM_MAX_SAMPLES: ${LPR_MAINSTREAM_MAX_SAMPLES:-12}
      LPR_MAINSTREAM_CONSENSUS_MIN: ${LPR_MAINSTREAM_CONSENSUS_MIN:-2}
      LPR_MIN_PLATE_LEN: ${LPR_MIN_PLATE_LEN:-3}
      LPR_PLATE_DET_CONF: ${LPR_PLATE_DET_CONF:-0.30}
      LPR_PLATE_DETECT_MODEL: ${LPR_PLATE_DETECT_MODEL:-/models/license_plate.pt}
      LPR_POLL_INTERVAL: ${LPR_POLL_INTERVAL:-1}
      LPR_SET_SUB_LABEL: ${LPR_SET_SUB_LABEL:-1}
      LPR_SUSPECT_PLATES: ${LPR_SUSPECT_PLATES:-}
      LPR_SUSPECT_PLATES_FILE: ${LPR_SUSPECT_PLATES_FILE:-/lpr-config/suspect_plates.txt}
      LPR_TELEGRAM_BOT_TOKEN: ${LPR_TELEGRAM_BOT_TOKEN:-}
      LPR_TELEGRAM_CHAT_ID: ${LPR_TELEGRAM_CHAT_ID:-}
      LPR_USE_FRIGATE_BOX: ${LPR_USE_FRIGATE_BOX:-1}
      LPR_WATCHLIST_DB: ${LPR_WATCHLIST_DB:-/lpr-config/watchlist.db}
      LPR_WATCHLIST_API_URL: ${LPR_WATCHLIST_API_URL:-http://watchlist-api:5001}
      LPR_ZONES_FILE: ${LPR_ZONES_FILE:-/lpr-config/lpr_zones.json}
      WATCHLIST_FEDERATION_SHARED_SECRET: ${WATCHLIST_FEDERATION_SHARED_SECRET:?WATCHLIST_FEDERATION_SHARED_SECRET is required}
      WATCHLIST_SERVICE_SHARED_SECRET: ${WATCHLIST_SERVICE_SHARED_SECRET:?WATCHLIST_SERVICE_SHARED_SECRET is required}
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-vms.local}
      ALERT_PUBLIC_DOMAIN: ${ALERT_PUBLIC_DOMAIN:-${PUBLIC_DOMAIN:-vms.local}}
      LPR_ATTR_MODE: ${LPR_ATTR_MODE:-primary}
      LPR_ATTR_MODEL_DIR: ${LPR_ATTR_MODEL_DIR:-/models/attr}
    volumes:
      - ./lpr-service/app.py:/app/app.py:ro
      - ./lpr-service/vehicle_mmcr.py:/app/vehicle_mmcr.py:ro
      - ./lpr-service/vehicle_attr_onnx.py:/app/vehicle_attr_onnx.py:ro
      - ./lpr-service/thlprv2_onnx.py:/app/thlprv2_onnx.py:ro
      - ./lpr-service/face_onnx.py:/app/face_onnx.py:ro
      - ./lpr-service/runtime_health.py:/app/runtime_health.py:ro
      - ./config/faces:/config/faces
      - nas-storage:/data/nas-storage:ro
      - ./LicensePlateRECOG/model:/models:ro
      - ./config/lpr:/lpr-config:ro
      - ./config/certs:/federation-certs:ro
      - ./lpr-data:/data
      - ./lpr-model-store:/model-store:ro
      - ./config/dashboard-settings:/settings-data:ro
    healthcheck:
      # Require both a progressing process and successful Frigate polling; three
      # failures tolerate a short restart without reporting a healthy-but-blind LPR.
      test: ["CMD", "python3", "/app/runtime_health.py", "/data/health/lpr.json", "--max-age", "45", "--require-upstream"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]


  # Reviewed active-learning worker.  This upgrades the existing LPR pipeline;
  # it has no camera access and consumes only human-confirmed database rows.
  lpr-trainer:
    container_name: lpr-trainer
    image: lpr-service:local
    build:
      context: ./lpr-service
    command: ["python3", "-u", "/app/train_pipeline.py", "--exit-when-idle"]
    profiles:
      - manual
    restart: "no"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    networks:
      - lpr-data
      - media-egress
    shm_size: '2gb'
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      WATCHLIST_DB_PATH: /data/watchlist.db
      LPR_DATASET_DIR: /data/dataset
      LPR_MODEL_STORE_DIR: /model-store
      LPR_BASE_DETECTOR: /base-models/license_plate.pt
      LPR_BASE_CHAR_MODEL: /base-models/data_plate.pt
      LPR_DEVICE: ${LPR_TRAIN_DEVICE:-0}
      LPR_TRAIN_EPOCHS: ${LPR_TRAIN_EPOCHS:-20}
      LPR_LINE_OCR_EPOCHS: ${LPR_LINE_OCR_EPOCHS:-20}
      LPR_SYNTHETIC_COUNT: ${LPR_SYNTHETIC_COUNT:-600}
      LPR_MIN_COVERAGE_PER_KIND: ${LPR_MIN_COVERAGE_PER_KIND:-10}
      LPR_METRIC_TOLERANCE: ${LPR_METRIC_TOLERANCE:-0.005}
      LPR_THAI_FONT_PATHS: ${LPR_THAI_FONT_PATHS:-/thai-fonts/tahoma.ttf,/thai-fonts/THSarabunNew.ttf,/thai-fonts/LeelawUI.ttf}
      LPR_DISCORD_WEBHOOK_URL: ${LPR_DISCORD_WEBHOOK_URL:-}
      LPR_TELEGRAM_BOT_TOKEN: ${LPR_TELEGRAM_BOT_TOKEN:-}
      LPR_TELEGRAM_CHAT_ID: ${LPR_TELEGRAM_CHAT_ID:-}
      HOME: /tmp
      ULTRALYTICS_CONFIG_DIR: /tmp/Ultralytics
      YOLO_CONFIG_DIR: /tmp/Ultralytics
    volumes:
      - ./config/lpr:/data
      - ./lpr-data:/lpr-data:ro
      - ./LicensePlateRECOG/model:/base-models:ro
      - ./lpr-model-store:/model-store
      - type: bind
        source: ${LPR_THAI_FONTS_DIR:-C:/Windows/Fonts}
        target: /thai-fonts
        read_only: true
    healthcheck:
      # The heartbeat thread remains fresh during long training epochs, while a
      # dead or wedged process becomes unhealthy without a network port.
      test: ["CMD", "python3", "/app/runtime_health.py", "/model-store/health/lpr-trainer.json", "--max-age", "45"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 90s

  config-api:
    container_name: config-api
    image: config-api:local
    build:
      context: ./config-api
    restart: unless-stopped
    depends_on:
      config-validator:
        condition: service_healthy
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    networks:
      - security
      - config-validation
      - edge
    environment:
      CONFIG_API_FRIGATE_VALIDATOR_HOST: config-validator
      CONFIG_API_FRIGATE_VALIDATOR_PORT: 5004
      CONFIG_API_LPR_CAMERAS_PATH: /lpr-settings/lpr_cameras.txt
      WATCHLIST_FEDERATION_SHARED_SECRET: ${WATCHLIST_FEDERATION_SHARED_SECRET:?WATCHLIST_FEDERATION_SHARED_SECRET is required}
    volumes:
      - ./config:/config
      - ./config-api/api.py:/app/api.py:ro
      - ./config-api/stream_probe.py:/app/stream_probe.py:ro
      - ./config-api/system_updater.py:/app/system_updater.py:ro
      - ..:/repo
      - ./config/lpr/lpr_cameras.txt:/lpr-settings/lpr_cameras.txt:ro
      - ./config/dashboard-settings:/settings-data:ro
      # The atomic writer needs the config directory itself; nested masks hide
      # sibling-service credentials and personal data from this process.
      - type: tmpfs
        target: /config/auth
        tmpfs:
          size: 1048576
      - type: tmpfs
        target: /config/certs
        tmpfs:
          size: 1048576
      - type: tmpfs
        target: /config/lpr
        tmpfs:
          size: 1048576
      - type: tmpfs
        target: /config/dashboard-settings
        tmpfs:
          size: 1048576
      # Same reason as Frigate: ./config/acme holds the live TLS private key and the
      # DuckDNS token, which this service has no reason to read.
      - type: tmpfs
        target: /config/acme
        tmpfs:
          size: 1048576

  # Canonical validation runs the exact parser from the pinned Frigate image in a
  # read-only, device-free service reachable only by config-api.
  config-validator:
    container_name: config-validator
    image: config-validator:local
    env_file:
      - ./config/camera_credentials.env
    build:
      context: ./config-validator
    restart: unless-stopped
    read_only: true
    user: "65532:65532"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5004/health', timeout=2).read()"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    tmpfs:
      - /tmp
    networks:
      - config-validation
    environment:
      FRIGATE_DVR_USER: ${FRIGATE_DVR_USER:?FRIGATE_DVR_USER is required}
      FRIGATE_DVR_PASS: ${FRIGATE_DVR_PASS:?FRIGATE_DVR_PASS is required}
      FRIGATE_PRASAT_USER: ${FRIGATE_PRASAT_USER:?FRIGATE_PRASAT_USER is required}
      FRIGATE_PRASAT_PASS: ${FRIGATE_PRASAT_PASS:?FRIGATE_PRASAT_PASS is required}
      FRIGATE_CAM11_USER: ${FRIGATE_CAM11_USER:-}
      FRIGATE_CAM11_PASS: ${FRIGATE_CAM11_PASS:-}
      HOME: /tmp
      XDG_CACHE_HOME: /tmp
    volumes:
      - ./config/model_cache:/config/model_cache:ro

  # tailscale ÃƒÆ’Ã‚Â¢ÃƒÂ¢Ã¢â‚¬Å¡Ã‚Â¬ÃƒÂ¢Ã¢â€šÂ¬Ã‚Â Always-On Mesh Network for NAS Sync & Remote Multi-Site Access
  tailscale:
    container_name: tailscale-service
    image: tailscale/tailscale:latest
    hostname: ${TAILSCALE_HOSTNAME:-bpp215-vms}
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - TS_AUTHKEY=${TAILSCALE_AUTHKEY:-}
      - TS_HOSTNAME=${TAILSCALE_HOSTNAME:-bpp215-vms}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_EXTRA_ARGS=--accept-routes
      - TS_SERVE_CONFIG=/config/tailscale-serve.json
    volumes:
      - tailscale-state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
      - ./config/tailscale:/config:ro
    networks:
      edge:
        aliases:
          - nas-bot
      security:
      lpr-data:
        aliases:
          - nas-bot
    ports:
      - "127.0.0.1:5005:5005"

  # nas-bot ÃƒÆ’Ã‚Â¢ÃƒÂ¢Ã¢â‚¬Å¡Ã‚Â¬ÃƒÂ¢Ã¢â€šÂ¬Ã‚Â Multi-Platform Bot (Telegram, LINE, Discord, Dashboard Chat) & NAS Storage Integration
  nas-bot:
    container_name: nas-bot-service
    image: nas-bot-service:local
    build:
      context: ./nas-bot-service
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    network_mode: "service:tailscale"
    depends_on:
      - tailscale
    environment:
      NAS_STORAGE_PATH: ${NAS_STORAGE_PATH:-/data/nas-storage}
      NAS_DATA_DIR: /data
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET:-}
      LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      I2_BRIDGE_ROOT: /i2-bridge
      I2_IMPORT_MAX_BYTES: ${I2_IMPORT_MAX_BYTES:-1073741824}
      I2_IMPORT_MAX_ITEMS: ${I2_IMPORT_MAX_ITEMS:-250000}
      I2_LAYOUT_MAX_NODES: ${I2_LAYOUT_MAX_NODES:-250000}
      I2_BRIDGE_JOB_TIMEOUT_HOURS: ${I2_BRIDGE_JOB_TIMEOUT_HOURS:-24}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://n8n:5678/webhook/bpp-vms-master}
      NAS_HOST: ${NAS_HOST:-192.168.1.100}
      NAS_SHARE: ${NAS_SHARE:-BPP215}
      NAS_USERNAME: ${NAS_USERNAME:-Bpp215}
      NAS_PASSWORD: ${NAS_PASSWORD:-ChangeMePassword123}
      NAS_SYNC_ENABLED: ${NAS_SYNC_ENABLED:-true}
      NAS_SYNC_DEBOUNCE_SEC: ${NAS_SYNC_DEBOUNCE_SEC:-8}
      NAS_VIDEO_ARCHIVE_ENABLED: ${NAS_VIDEO_ARCHIVE_ENABLED:-true}
      NAS_VIDEO_ARCHIVE_INTERVAL_MIN: ${NAS_VIDEO_ARCHIVE_INTERVAL_MIN:-15}
      LOCAL_RECORDINGS_PATH: /media/recordings
      LOCAL_EXPORTS_PATH: /media/exports
      LOCAL_ARCHIVE_PATH: /media/archive-e
      LOCAL_CLIPS_PATH: /media/clips
      LOCAL_LPR_CROPS_PATH: /media/lpr-crops
      LOCAL_ARCHIVE_CROPS_PATH: /media/archive-e/lpr-crops
    volumes:
      - ./nas-bot-service:/app
      - nas-storage:/data/nas-storage
      - nas-bot-data:/data
      - ./storage/recordings:/media/recordings
      - ./storage/clips:/media/clips
      - ./storage/exports:/media/exports
      - ./lpr-data/crops:/media/lpr-crops
      - ${BPP_ARCHIVE_DIR:-./storage/lpr-archive}:/media/archive-e
      - ./config/nvr_groups.json:/config/nvr_groups.json:ro
      - ./config/lpr:/lpr-config:ro
      - ./config/dashboard-settings:/settings-data:ro
      - ./runtime/i2-bridge:/i2-bridge

  # analytics-engine ÃƒÆ’Ã†â€™Ãƒâ€šÃ‚Â¢ÃƒÆ’Ã‚Â¢ÃƒÂ¢Ã¢â€šÂ¬Ã…Â¡Ãƒâ€šÃ‚Â¬ÃƒÆ’Ã‚Â¢ÃƒÂ¢Ã¢â€šÂ¬Ã‚Â  Phase 4 AI Data Analytics, Heatmap & Drug Intelligence Engine
  analytics-engine:
    container_name: analytics-engine
    image: analytics-engine:local
    build:
      context: ./analytics-engine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - edge
      - security
      - lpr-data
    volumes:
      - nas-storage:/data/nas-storage:ro
      - ./config/lpr:/lpr-config:ro
      - ./config/dashboard-settings:/settings-data:ro
      - ./analytics-engine:/app

  # chat-service - Phase 5 AI Chat Engine: Natural Language Incident Parsing
  chat-service:
    container_name: chat-service
    image: chat-service:local
    build:
      context: ./chat-service
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - edge
    volumes:
      - ./chat-service:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5007/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Keeps <subdomain>.duckdns.org pointed at this site's current public IP, which
  # the ISP changes without notice. Everything remote depends on it: the operator
  # URL, the WebRTC STUN candidate, and acme's DNS-01 challenge below.
  # Declared here rather than left as a stray container so `docker compose up`
  # cannot silently remove it as an orphan.
  duckdns:
    container_name: duckdns
    image: lscr.io/linuxserver/duckdns:latest
    restart: unless-stopped
    networks:
      # Outbound-only client: it never serves a port and never talks to another
      # service here, so it stays off the application networks.
      - wan-egress
    environment:
      TZ: Asia/Bangkok
      # Target nodes keep these blank while the public-edge profile is disabled.
      SUBDOMAINS: ${DUCKDNS_SUBDOMAIN:-}
      TOKEN: ${DUCKDNS_TOKEN:-}
      UPDATE_IP: ipv4
      # Log to stdout (docker logs) instead of a file inside the container, which
      # nothing mounts and nobody would read.
      LOG_FILE: "false"

  # Cloudflare Zero Trust Tunnel: Secure outbound HTTPS tunnel bypassing router port forward and all VPN blocks
  cloudflared:
    container_name: cloudflared-tunnel
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN is required}
    networks:
      - edge



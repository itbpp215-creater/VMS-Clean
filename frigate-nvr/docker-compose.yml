    volumes:
      - ./config/acme:/acme.sh          # state/ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸Ãƒâ€¦Ã‚Â¡ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸Ãƒâ€šÃ‚Â±ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸Ãƒâ€šÃ‚ÂÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸Ãƒâ€¦Ã‚Â ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸Ãƒâ€šÃ‚Âµ ACME + cert ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸ÃƒÂ¢Ã¢â€šÂ¬Ã‚Â¢ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¹ÃƒÂ¢Ã¢â€šÂ¬Ã‚Â°ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸ÃƒÂ¢Ã¢â‚¬Å¾Ã‚Â¢ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸ÃƒÂ¢Ã¢â€šÂ¬Ã‚Â°ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸Ãƒâ€¦Ã‚Â¡ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸Ãƒâ€šÃ‚Â±ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸Ãƒâ€¦Ã‚Â¡ (machine-local)
      - ./config/certs:/certs-out       # ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸ÃƒÂ¢Ã¢â€šÂ¬Ã‚ÂºÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸Ãƒâ€šÃ‚Â¥ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸Ãƒâ€šÃ‚Â²ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸Ãƒâ€šÃ‚Â¢ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸ÃƒÂ¢Ã¢â€šÂ¬Ã¢â‚¬ÂÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸Ãƒâ€šÃ‚Â²ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸ÃƒÂ¢Ã¢â€šÂ¬Ã‚Â¡ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸ÃƒÂ¢Ã¢â€šÂ¬Ã¢â‚¬ÂÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸Ãƒâ€šÃ‚ÂµÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¹Ãƒâ€¹Ã¢â‚¬Â  nginx (dashboard) mount ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸Ãƒâ€šÃ‚Â­ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¹Ãƒâ€¹Ã¢â‚¬Â ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸Ãƒâ€šÃ‚Â²ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸ÃƒÂ¢Ã¢â‚¬Å¾Ã‚Â¢ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¹ÃƒÂ¢Ã¢â‚¬Å¡Ã‚Â¬ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸ÃƒÂ¢Ã¢â€šÂ¬Ã‚ÂºÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¹ÃƒÂ¢Ã¢â€šÂ¬Ã‚Â¡ÃƒÆ’Ã‚Â Ãƒâ€šÃ‚Â¸ÃƒÂ¢Ã¢â‚¬Å¾Ã‚Â¢ :ro

  # n8n ÃƒÆ’Ã‚Â¢ÃƒÂ¢Ã¢â‚¬Å¡Ã‚Â¬ÃƒÂ¢Ã¢â€šÂ¬Ã‚Â Automation Workflow Engine & Multi-Agent AI Orchestrator
  n8n:
    container_name: n8n-service
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    networks:
      - edge
      - security
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - GENERIC_TIMEZONE=Asia/Bangkok
      - TZ=Asia/Bangkok
      - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_RUNNERS_ENABLED=true
      - N8N_HIRING_BANNER_ENABLED=false
      - N8N_DIAGNOSTICS_ENABLED=false
    volumes:
      - n8n-data:/home/node/.n8n
      - ../n8n:/n8n-init:ro

  system-restarter:
    container_name: system-restarter
    image: docker:cli
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/workspace
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Starting system-restarter..."
        while true; do
          if [ -f /workspace/config/restart.trigger ]; then
            echo "Trigger found. Restarting..."
            rm -f /workspace/config/restart.trigger
            docker restart config-validator frigate-nvr
            echo "Restart complete."
          fi
          if [ -f /workspace/config/lpr/train.trigger ] || [ -f /workspace/config/train.trigger ]; then
            echo "LPR Train Trigger found. Starting lpr-trainer on demand..."
            rm -f /workspace/config/lpr/train.trigger /workspace/config/train.trigger
            docker start lpr-trainer
            echo "lpr-trainer started."
          fi
          if [ -f /workspace/config/update_services.trigger ]; then
            echo "System Update Trigger found. Restarting application services..."
            rm -f /workspace/config/update_services.trigger
            docker restart watchlist-api lpr-service analytics-engine chat-service config-api
            echo "Application services restarted."
          fi
          sleep 5
        done

networks:

  edge:
    driver: bridge
  media:
    driver: bridge
    # Service-to-service media traffic must not inherit Docker bridge NAT.
    # Frigate/LPR retain explicit outbound access through media-egress, while the
    # compatibility service has no attachment that can route to the Internet.
    internal: true
  media-egress:
    driver: bridge
  # Internet access for maintenance clients (dynamic DNS, ACME) that must not be
  # able to reach any application service on the other networks.
  wan-egress:
    driver: bridge
  security:
    driver: bridge
    internal: true
  lpr-data:
    driver: bridge
    internal: true
  config-validation:
    internal: true

volumes:
  frigate-db: {}
  cuda-cache: {}
  auth-db: {}
  nas-storage: {}
  nas-bot-data: {}
  n8n-data: {}
  tailscale-state: {}




  dashboard:
    container_name: nvr-dashboard
    # Pin nginx and Alpine patch families so gateway behavior does not drift
    # between otherwise identical deployments.
    image: nginx:1.29.8-alpine3.23@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - edge
      - media
      - security
    depends_on:
      - watchlist-api
      - auth-service
      - config-api
      - frigate
      # Dashboard can wait for its optional internal route, but Frigate has no
      # reverse dependency and therefore remains untouched by this addition.
      - media-compat-service
    # The nginx image renders templates at startup. Only the two proxy secrets
    # are substituted while the CIDR hook generates its validated ACL snippet.
    environment:
      # Pass only gateway-owned credentials and ACL input instead of exposing
      # camera, notification, or unrelated service secrets to Dashboard.
      WATCHLIST_PROXY_SHARED_SECRET: ${WATCHLIST_PROXY_SHARED_SECRET:?WATCHLIST_PROXY_SHARED_SECRET is required}
      MEDIA_COMPAT_PROXY_SHARED_SECRET: ${MEDIA_COMPAT_PROXY_SHARED_SECRET:?MEDIA_COMPAT_PROXY_SHARED_SECRET is required}
      BPP_FEDERATION_ALLOW_CIDR: ${BPP_FEDERATION_ALLOW_CIDR:-127.0.0.1/32}
      NGINX_ENVSUBST_FILTER: "^(WATCHLIST_PROXY_SHARED_SECRET|MEDIA_COMPAT_PROXY_SHARED_SECRET)$"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./dashboard-nginx.conf:/etc/nginx/templates/default.conf.template:ro
      # Source the ACL generator before nginx renders and validates its template;
      # .envsh avoids executable-bit differences on Windows bind mounts.
      - ./scripts/generate-federation-allow.envsh:/docker-entrypoint.d/19-generate-federation-allow.envsh:ro
      # Reload nginx by itself once acme.sh drops a renewed certificate into
      # ./config/certs, so TLS renewal needs no manual step. Also a .envsh
      # because bind-mounted *.sh lose the executable bit the entrypoint requires.
      - ./scripts/reload-nginx-on-cert-change.envsh:/docker-entrypoint.d/20-reload-nginx-on-cert-change.envsh:ro

services:
  frigate:
    container_name: frigate-nvr
    # NVIDIA access is granted by the explicit device reservation below. Keeping
    # the container unprivileged prevents it from unmounting secret masks or
    # gaining host-wide device capabilities unrelated to video processing.
    security_opt:
      - no-new-privileges:true
#    sysctls:
#      - net.ipv4.tcp_keepalive_time=15
#      - net.ipv4.tcp_keepalive_intvl=5
#      - net.ipv4.tcp_keepalive_probes=3
#      - net.core.rmem_max=16777216
#      - net.core.wmem_max=16777216
#      - net.ipv4.tcp_rmem=4096 87380 16777216
#      - net.ipv4.tcp_wmem=4096 65536 16777216
    networks:
      - media-egress
      - media
    restart: unless-stopped
    stop_grace_period: 10s
    env_file:
      - ./config/camera_credentials.env
    image: frigate-branded:local
    build:
      context: .
      dockerfile: Dockerfile

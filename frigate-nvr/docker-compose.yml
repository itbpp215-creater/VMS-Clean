  # media-compat-service derives portable MP4 files on demand without changing
  # Frigate recordings. It can reach only Frigate on the private media network,
  # owns no source-media/config mount, and is disabled until rollout validation.
  

  mqtt:
    container_name: mqtt
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    networks:
      - edge
  media-compat-service:
    container_name: media-compat-service
    image: media-compat-service:local
    build:
      context: ./media-compat-service
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - media
    environment:
      # The independent proxy credential is shared only with Dashboard; the
      # runtime gate stays false unless an operator explicitly completes rollout.
      MEDIA_COMPAT_PROXY_SHARED_SECRET: ${MEDIA_COMPAT_PROXY_SHARED_SECRET:?MEDIA_COMPAT_PROXY_SHARED_SECRET is required}
      MEDIA_COMPAT_ENABLED: ${MEDIA_COMPAT_ENABLED:-false}
      # Source resolution remains pinned to Frigate's internal, unencrypted
      # Docker authority and cannot be selected by a browser request.
      FRIGATE_BASE_URL: http://frigate:5000
    volumes:
      # Derived cache is isolated from recordings and remains on the approved D
      # project drive; the service never mounts ./storage or ./config.
      - type: bind
        source: ./runtime-cache/mobile-video
        target: /cache
      # One active encoder receives a bounded ephemeral workspace. The explicit
      # mode makes the mount writable by the non-root runtime identity only as a
      # shared scratch directory; no executable/device/suid behavior is needed.
      - type: tmpfs
        target: /work
        tmpfs:
          size: 536870912
          mode: 0777
    deploy:
      resources:
        reservations:
          devices:
            # A single NVIDIA device is mandatory; application health rejects
            # absent NVENC and there is deliberately no CPU encoder fallback.
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      # Read the credential from process environment rather than interpolating it
      # into the command line; assert readiness so GPU/Frigate faults fail closed.
      test:
        - CMD
        - python3
        - -c
        - "import json,os,urllib.request; request=urllib.request.Request('http://127.0.0.1:5008/health',headers={'X-User':'healthcheck','X-Role':'user','X-BPP-Proxy-Secret':os.environ['MEDIA_COMPAT_PROXY_SHARED_SECRET']}); assert json.load(urllib.request.urlopen(request,timeout=3))['ready'] is True"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s


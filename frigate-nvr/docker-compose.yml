  auth-service:
    container_name: auth-service
    image: auth-service:local
    build:
      context: ./auth-service
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    networks:
      - security
    volumes:
      - auth-db:/data
      - ./auth-service/auth.py:/app/auth.py:ro
    environment:
      # Auth receives only its audit-ingest credential and cookie policy; JWT
      # signing material remains in the mounted, gitignored secret.key file.
      AUTH_AUDIT_SHARED_SECRET: ${AUTH_AUDIT_SHARED_SECRET:?AUTH_AUDIT_SHARED_SECRET is required}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      AUTH_SESSION_HOURS: ${AUTH_SESSION_HOURS:-720}
      AUTH_TRUSTED_PROXY_HOST: dashboard


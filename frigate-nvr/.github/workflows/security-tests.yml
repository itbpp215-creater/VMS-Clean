# Security regressions expose one CI check per language: every trust boundary,
# config transaction, LPR notification flow, and real-asset browser smoke test
# runs on pull requests and main for review/branch-protection evidence.
name: security-tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Patch-pinned action releases reduce workflow supply-chain drift.
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11.15"
          cache: pip
          cache-dependency-path: |
            tests/requirements.txt
            auth-service/requirements*.txt
            config-api/requirements.txt
            watchlist-api/requirements.txt
      - name: Install pinned test dependencies
        run: python -m pip install --requirement tests/requirements.txt
      # Each service runs in a separate interpreter/import namespace, matching
      # its production container and preventing same-named modules from colliding.
      - name: Auth service
        run: PYTHONPATH=auth-service python -m pytest -q auth-service/tests
      - name: Watchlist API
        run: python -m unittest discover -s watchlist-api/tests -v
      - name: Config API
        run: PYTHONPATH=config-api python -m pytest -q config-api/tests
      - name: Canonical Frigate validator wrapper
        run: python -m unittest discover -s config-validator/tests -v
      - name: LPR notification and history flow
        run: python -m unittest discover -s lpr-service/tests -v
      - name: Repository security invariants
        run: python -m pytest -q tests

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Node and Playwright are patch-pinned; npm ci verifies the lock file.
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "22.23.1"
          cache: npm
      - name: Install locked browser dependency
        run: npm ci
      - name: Install locked Chromium runtime
        run: npx playwright install --with-deps chromium
      - name: Run real-dashboard smoke tests
        run: npm run test:browser

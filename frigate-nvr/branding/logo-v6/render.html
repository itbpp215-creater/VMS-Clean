<!doctype html>
<!-- Query-controlled browser renderer provides consistent curved type, shield preview, and isolated PSD layers. -->
<html>

<head>
  <meta charset="utf-8">
  <style>
    @page {
      size: 1500pt 1500pt;
      margin: 0
    }

    html,
    body {
      width: 2000px;
      height: 2000px;
      margin: 0;
      overflow: hidden;
      background: transparent
    }

    svg {
      width: 2000px;
      height: 2000px
    }

    body.type-only #art {
      visibility: hidden
    }

    body.art-only #type {
      visibility: hidden
    }
  </style>
</head>

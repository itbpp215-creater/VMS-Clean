worker_processes 1;

error_log logs/error.log info;

events {
    worker_connections 4096;
}

rtmp {
    server {
        listen 1935;
        chunk_size 4096;
        
        application A04_Chanod { live on; record off; }
        application A05_Manorom { live on; record off; }
        application A06_Wanyai { live on; record off; }
        application A08_Namgum { live on; record off; }
        application A11_Donnanghong { live on; record off; }
        application A17_CHYU { live on; record off; }
        application A18_Tautain { live on; record off; }
        application A19_Nakhonruang { live on; record off; }
        application A20_Nongtao { live on; record off; }
        application live { live on; record off; }
    }
}

http {
    server {
        listen 8081;
        location / {
            root html;
        }
    }
}